name: ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Copy and boundary gates
        run: npm run check:sync-copy && npm run check:m0-web-legal && npm run check:account-boundary
      - name: Build
        run: npm run build
